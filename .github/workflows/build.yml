
name: Build Fabric Mod JAR

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q ProjectContentLoader-v0.1.zip -d project
          echo "PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")" >> $GITHUB_ENV

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ProjectContentLoader-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
